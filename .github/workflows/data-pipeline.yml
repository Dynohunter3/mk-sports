# Daily multi-source data job: fetch -> link -> retrain (monthly) -> predict -> grade -> publish.
# Runs on GitHub's free minutes (unlimited for public repositories); no server needed.
# Optional keys live in the repository's Actions secrets (Settings > Secrets and variables > Actions)
# and reach the job only as environment variables; a source without a key is skipped automatically.
# Published for the app: GitHub Pages (primary, once switched on in Settings > Pages) and the `predictions`
# branch (mirror; always written, so the app has a source even without Pages).
# If the health check finds a critical problem the job fails and GitHub emails the repository owner.
name: data-pipeline

on:
  schedule:
    # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC): GitHub can delay or skip a scheduled run, and results and
    # odds arrive at irregular times; 18:17 also follows football-data.co.uk's Tue/Fri odds collection
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # push the predictions mirror branch
  pages: write
  id-token: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 100 # the first run backfills 13 seasons (about 20 minutes of polite downloads)
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    defaults:
      run:
        working-directory: pipeline
    env:
      FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      MK_ALERT_WEBHOOK: ${{ secrets.MK_ALERT_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # same as the machine the models were built and verified on
      - name: Restore store, models and HTTP cache
        uses: actions/cache@v4
        with:
          path: pipeline/var
          key: mkdata-${{ github.run_id }}
          restore-keys: mkdata-
      - name: Install and test
        run: python -m pip install --quiet pytest -r requirements-model.txt && python -m pytest -q
      - name: First run on this machine - backfill every season the models use
        run: |
          if [ ! -f var/mkdata.sqlite ]; then python -m mkdata sync --backfill; fi
      - name: History for competitions added since the store was built (nothing to do once fetched)
        run: python -m mkdata sync --backfill --missing
      - name: Fetch current season from every usable source
        run: python -m mkdata sync --current
      - name: Upcoming fixtures and current odds
        run: python -m mkdata upcoming
      - name: Internal IDs, canonical matches, conflicts
        run: python -m mkdata link
      - name: Ratings
        run: python -m mkdata elo
      - name: Retrain the model (1st of the month only; otherwise skipped)
        run: python -m mkmodel.production retrain --if-due
      - name: Predict the next 21 days (writes only predictions whose inputs changed)
        run: python -m mkmodel.production predict
      - name: Grade finished matches
        run: python -m mkmodel.production grade
      - name: Season simulator (every remaining fixture, 10,000 times per league)
        continue-on-error: true # the app copes without simulations.json; never block the predictions
        run: python -m mkmodel.simulate
      - name: Team strength history (the model's Elo, per competition)
        continue-on-error: true
        run: python -m mkmodel.elo_history
      - name: Cross-check and snapshot
        run: |
          python -m mkdata crosscheck --out var/crosscheck.json > /dev/null
          python -m mkdata snapshot > var/snapshot.json
      - name: Player photos (Wikidata + Wikimedia Commons; a failure here never fails the job)
        continue-on-error: true
        timeout-minutes: 50
        run: |
          python -m pip install --quiet -r requirements-photos.txt
          python -m mkdata photos --budget 4000 --max-minutes 40
      - name: Prepare the public site
        run: |
          rm -rf ../site && mkdir -p ../site
          cp -r ../pages/. ../site/   # the download page, the league-link page and the photo credits page
          cp -r var/publish/. ../site/   # predictions, accuracy, simulations, elo/<competition>.json
          cp var/models/current.json ../site/model.json
          if [ -f var/photos/public/meta.json ]; then   # player photos: index, credits and face crops
            mkdir -p ../site/photos && cp -r var/photos/public/. ../site/photos/
            if [ -d var/photos/i ]; then cp -r var/photos/i ../site/photos/; fi
          fi
      # The predictions branch is the public, timestamped record: one commit per run on top of the last one, never
      # force-pushed, so every published prediction stays in its history. proof.json maps each prediction to the
      # first commit that published it (a second commit, since a commit cannot contain its own id).
      - name: Publish mirror (predictions branch, appended, never force-pushed)
        working-directory: site
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git init -q -b predictions
          git config user.name "mk-sports-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REMOTE"
          echo '{}' > ../proof.previous.json
          if git fetch -q --depth 1 origin predictions; then
            git reset -q FETCH_HEAD
            git show FETCH_HEAD:proof.json > ../proof.previous.json 2>/dev/null || echo '{}' > ../proof.previous.json
          fi
          rm -f proof.json
          git add -A -- . ':(exclude)photos' ':(exclude)proof.json'   # photos: Pages only
          git commit -q -m "Predictions $(date -u +%Y-%m-%dT%H:%MZ) (run ${{ github.run_id }})" || echo "nothing new to publish"
          python ../pipeline/mkmodel/proof.py --site . --previous ../proof.previous.json \
            --commit "$(git rev-parse HEAD)" --at "$(git show -s --format=%cI HEAD)" \
            --run "${{ github.run_id }}" --repo "${{ github.repository }}"
          git add proof.json
          git commit -q -m "Proof index for $(git rev-parse --short HEAD)" || echo "proof index unchanged"
          git push -q origin HEAD:predictions
      - name: Is GitHub Pages switched on?
        id: pages
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::Predictions were published to the predictions branch, which the app reads. To publish to Pages as well: Settings > Pages > Build and deployment > Source: GitHub Actions."
          fi
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Health (fails the job on critical alerts)
        run: python -m mkdata health --status var/status.json --baselines config/baselines.json
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkdata-reports
          path: |
            pipeline/var/status.json
            pipeline/var/crosscheck.json
            pipeline/var/snapshot.json
            pipeline/var/publish/
            pipeline/var/models/current.json
            pipeline/var/photos/report.json
            pipeline/registry/
          retention-days: 30

  pages:
    needs: sync
    # publish even when the health check flagged a problem; skipped until Pages is switched on
    if: ${{ !cancelled() && needs.sync.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
